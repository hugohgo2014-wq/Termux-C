plugins {
    id 'com.android.application'
}

android {
    namespace 'com.terminal.nativeapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.terminal.nativeapp'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags ''
                arguments '-DANDROID_STL=none'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
